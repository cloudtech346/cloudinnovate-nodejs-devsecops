version: 0.2

phases:
  install:
    runtime-versions:
      nodejs: 20
    commands:
      - npm ci
      - mkdir -p reports
      - chmod 777 reports

  pre_build:
    commands:
      - echo "Running unit tests"
      - npm test
      - echo "Installing Snyk"
      - npm install -g snyk
      - echo "Running Snyk dependency scan"
      - |
        snyk test --severity-threshold=high --json-file-output=reports/snyk-sca.json || echo "WARNING: Snyk skipped due to lab network restriction"

  build:
    commands:
      - echo "Starting Node.js application"
      - npm start > app.log 2>&1 &
      - echo $! > app.pid
      - |
        for i in {1..30}; do
          if curl -fsS http://127.0.0.1:3000/health; then
            echo "Application is running"
            break
          fi
          sleep 2
        done
      - curl -f http://127.0.0.1:3000/health
      - echo "Running OWASP ZAP scan"
      - docker run --rm --network host --user 0:0 -v "$PWD/reports:/zap/wrk:rw" ghcr.io/zaproxy/zaproxy:stable zap-baseline.py -t http://127.0.0.1:3000 -J zap-report.json -r zap-report.html -I

  post_build:
    commands:
      - if [ -n "$REPORTS_BUCKET" ]; then aws s3 cp reports/ "s3://${REPORTS_BUCKET}/${CODEBUILD_BUILD_ID}/" --recursive; else echo "Reports retained as CodeBuild artifacts only."; fi
      - if [ -f app.pid ]; then kill "$(cat app.pid)" || true; fi
artifacts:
  files:
    - 'reports/**/*'
    - 'app.log'
