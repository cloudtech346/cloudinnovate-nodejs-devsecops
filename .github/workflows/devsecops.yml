name: Node.js DevSecOps

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-security:
    runs-on: ubuntu-latest

    steps:
      # Checkout Source Code
      - name: Checkout source code
        uses: actions/checkout@v4

      # Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      # Install Dependencies
      - name: Install dependencies
        run: npm ci

      # Run Unit Tests
      - name: Run unit tests
        run: npm test

      # Install Snyk CLI
      - name: Install Snyk CLI
        run: npm install --global snyk

      # SCA - Dependency Scan
      - name: SCA - Snyk dependency scan
        continue-on-error: true
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: snyk test --debug --file=package-lock.json --severity-threshold=high

      # SAST - Source Code Scan
      - name: SAST - Snyk code scan
        continue-on-error: true
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: snyk code test

      # Start Node.js Application
      - name: Start demo application
        run: |
          npm start > app.log 2>&1 &
          echo $! > app.pid

          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:3000/health; then
              echo "Application started successfully"
              exit 0
            fi

            sleep 2
          done

          cat app.log
          exit 1

      # DAST - OWASP ZAP Scan
      - name: DAST - OWASP ZAP baseline scan
        run: |
          mkdir -p reports
          chmod 777 reports

          docker run --rm --network host \
            -v "$PWD/reports:/zap/wrk/:rw" \
            ghcr.io/zaproxy/zaproxy:stable \
            zap-baseline.py \
            -I \
            -t http://127.0.0.1:3000 \
            -J zap-report.json \
            -r zap-report.html

      # Upload Security Reports
      - name: Upload security reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-reports
          path: reports/
          if-no-files-found: ignore

      # Stop Application
      - name: Stop demo application
        if: always()
        run: |
          if [ -f app.pid ]; then
            kill "$(cat app.pid)" || true
          fi
