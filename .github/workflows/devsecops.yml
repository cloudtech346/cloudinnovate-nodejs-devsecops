```yaml
name: Node.js DevSecOps

on:
  push:
    branches: [main]

  pull_request:
    branches: [main]

  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  build-and-security:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout source code
      - name: Checkout
        uses: actions/checkout@v4

      # 2. Setup Node.js
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      # 3. Install dependencies
      - name: Install dependencies
        run: npm ci

      # 4. Run unit tests
      - name: Unit tests
        run: npm test

      # 5. SCA - Dependency scanning with Snyk
      - name: SCA - dependency scan with Snyk
        uses: snyk/actions/node@master
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: --severity-threshold=high

      # 6. SAST - Source code scanning with Snyk
      - name: SAST - source code scan with Snyk
        uses: snyk/actions/node@master
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          command: code
          args: test --severity-threshold=high

      # 7. Start demo application
      - name: Start demo application
        run: |
          mkdir -p reports
          npm start > app.log 2>&1 &
          echo $! > app.pid

          ready=0

          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:3000/health; then
              ready=1
              break
            fi
            sleep 2
          done

          if [ "$ready" -ne 1 ]; then
            echo "Application failed to start"
            cat app.log
            exit 1
          fi

          echo "Application started successfully"

      # 8. DAST - OWASP ZAP baseline scan
      - name: DAST - OWASP ZAP baseline scan
        run: |
          docker run --rm --network host \
            -v "$PWD/reports:/zap/wrk/:rw" \
            ghcr.io/zaproxy/zaproxy:stable \
            zap-baseline.py \
            -t http://127.0.0.1:3000 \
            -J zap-report.json \
            -r zap-report.html

      # 9. Upload security reports
      - name: Upload security reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-reports
          path: reports/
          if-no-files-found: ignore
```
