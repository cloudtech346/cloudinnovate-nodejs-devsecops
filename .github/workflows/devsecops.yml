name: Node.js DevSecOps

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  build-and-security:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test

      # SCA - Dependency Security Scan
      - name: SCA - Snyk dependency scan
        uses: snyk/actions/node@master
        continue-on-error: true
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          command: test
          args: --file=package-lock.json --package-manager=npm --severity-threshold=high

      # SAST - Source Code Security Scan
      - name: SAST - Snyk code scan
        uses: snyk/actions/node@master
        continue-on-error: true
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          command: code test
          args: --severity-threshold=high

      # Start Node.js Application
      - name: Start demo application
        run: |
          npm start > app.log 2>&1 &
          echo $! > app.pid

          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:3000/health; then
              echo "Application started successfully"
              exit 0
            fi

            sleep 2
          done

          cat app.log
          exit 1

      # DAST - OWASP ZAP Scan
      - name: DAST - OWASP ZAP baseline scan
        run: |
          mkdir -p reports

          docker run --rm --network host \
            -v "$PWD/reports:/zap/wrk/:rw" \
            ghcr.io/zaproxy/zaproxy:stable \
            zap-baseline.py \
            -t http://127.0.0.1:3000 \
            -J zap-report.json \
            -r zap-report.html

      # Upload Security Reports
      - name: Upload security reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-reports
          path: reports/
          if-no-files-found: ignore

      # Stop Application
      - name: Stop demo application
        if: always()
        run: |
          if [ -f app.pid ]; then
            kill "$(cat app.pid)" || true
          fi
